<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BahaMap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #undoBar {
    display: none; position: absolute; left: 10px; right: 10px; bottom: 160px;
    z-index: 1100; background: #fff; border-radius: 12px; padding: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35); text-align: center; font-size: 14px;
  }
  #undoBar button { background: #666; margin-left: 8px; padding: 8px 16px; }
  #map { position: absolute; inset: 0 0 150px 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
    background: #fff; padding: 10px; box-sizing: border-box;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  #msg { grid-column: 1 / -1; font-size: 13px; color: #444; text-align: center; margin: 0; }
  button {
    border: 0; border-radius: 10px; font-size: 16px; font-weight: 700;
    color: #fff; padding: 8px;
  }
  button small { display: block; font-weight: 400; font-size: 12px; }
  .lusot { background: #1a8a3c; }
  .gutter { background: #c79a00; }
  .tuhod { background: #e07000; }
  .lubog { background: #c62828; }
  button {
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0.3);
    filter: brightness(0.9);
  }
</style>
</head>
<body>

<!-- The map goes here -->
<div id="map"></div>

<!-- The four report buttons -->
<div id="panel">
  <p id="msg">Tap the button that matches the street you are on.</p>
  <button class="lusot" onclick="report('lusot')">Lusot lahat<small>Passable to all</small></button>
  <button class="gutter" onclick="report('gutter')">Gutter-deep<small>No sedans</small></button>
  <button class="tuhod" onclick="report('tuhod')">Hanggang tuhod<small>SUVs only</small></button>
  <button class="lubog" onclick="report('lubog')">Lubog<small>Submerged</small></button>
</div>
<div id="undoBar">
  Wrong button?
  <button onclick="undoReport()">Undo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>

  const API = 'https://script.google.com/macros/s/AKfycbzGM0Ue_abbtPUflQn1EsVpezkxRPGeKrrixm1gCx5y3yzPRC1YXCaItwk_WBw9CxPG/exec';

  const COLORS = { lusot: '#1a8a3c', gutter: '#c79a00', tuhod: '#e07000', lubog: '#c62828' };
  const LABELS = { lusot: 'Lusot lahat', gutter: 'Gutter-deep', tuhod: 'Hanggang tuhod', lubog: 'Lubog' };
  const msg = document.getElementById('msg');


  const map = L.map('map').setView([14.586, 121.176], 14);
  L.maplibreGL({
    style: 'https://tiles.openfreemap.org/styles/positron',
    attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
  }).addTo(map);


  map.locate({ setView: true, maxZoom: 16 });


  const pins = L.layerGroup().addTo(map);

  async function loadPins() {
    if (!API) { msg.textContent = 'Setup needed: paste your Apps Script URL into index.html.'; return; }
    try {
      const res = await fetch(API);
      const rows = await res.json();
      pins.clearLayers();
      rows.forEach(r => {
        const ageHours = (Date.now() - new Date(r.time).getTime()) / 3600000;
        const fade = Math.max(0.25, 1 - ageHours / 3);
        L.circleMarker([r.lat, r.lng], {
          radius: r.confirmed ? 12 : 9,
          color: COLORS[r.status], fillColor: COLORS[r.status],
          fillOpacity: r.confirmed ? fade : 0.1,
          opacity: fade,
          dashArray: r.confirmed ? null : '4 4'
        }).addTo(pins).bindPopup(
          LABELS[r.status] + (r.confirmed ? '' : ' (unconfirmed)') +
          '<br>' + new Date(r.time).toLocaleTimeString()
        );
      });
    } catch (err) {
      msg.textContent = 'Could not load reports. Check your connection.';
    }
  }


  function report(status) {
    if (navigator.vibrate) navigator.vibrate(30);
    if (!API) { msg.textContent = 'Setup needed: paste your Apps Script URL into index.html.'; return; }
    msg.textContent = 'Getting your location...';
    navigator.geolocation.getCurrentPosition(async pos => {
      let id = '';
      try { id = localStorage.getItem('id') || (localStorage.id = crypto.randomUUID()); } catch (e) {}
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            lat: pos.coords.latitude, lng: pos.coords.longitude, status, device: id
          })
        });
        let out = {};
        try { out = await res.json(); } catch (e) {}
        if (out.result === 'duplicate') {
          msg.textContent = 'You already reported this spot. Try again in 2 hours.';
        } else if (out.result === 'invalid') {
          msg.textContent = 'Report rejected. Check your location and try again.';
        } else {
          msg.textContent = 'Salamat! Report sent. Wrong button? Tap Undo.';
          showUndo(id);
          loadPins();
        }
      } catch (err) {
        msg.textContent = 'Report not sent. Try again.';
      }
    }, () => {
      msg.textContent = 'Turn on location so we can pin your street.';
    });
  }

  let undoTimer;
  function showUndo(id) {
    const bar = document.getElementById('undoBar');
    bar.dataset.id = id;
    bar.style.display = 'block';
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { bar.style.display = 'none'; }, 30000); // 30 seconds
  }

  async function undoReport() {
    const bar = document.getElementById('undoBar');
    bar.style.display = 'none';
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'undo', device: bar.dataset.id })
      });
      const out = await res.json();
      msg.textContent = out.result === 'undone'
        ? 'Report removed. Tap the right button.'
        : 'Nothing to undo.';
      loadPins();
    } catch (err) {
      msg.textContent = 'Could not undo. Try again.';
    }
  }

  loadPins();
  setInterval(loadPins, 60000);
</script>
</body>
</html>
